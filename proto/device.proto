// Minimal faithful subset of the reverse-engineered Starlink user-terminal
// local gRPC API (service SpaceX.API.Device.Device, method Handle).
// The real dish exposes many more fields; this models the ones FleetView reads.
// Both the dish simulator (server) and the edge agent (client) load this file,
// so the agent speaks the exact same protocol it would to a real dish.
syntax = "proto3";

package SpaceX.API.Device;

service Device {
  // The real dish multiplexes everything through a single unary Handle() with a
  // oneof request / oneof response. We mirror that shape exactly.
  rpc Handle(Request) returns (Response);
}

message Request {
  oneof request {
    GetStatusRequest get_status = 1;
    GetHistoryRequest get_history = 2;
    GetObstructionMapRequest dish_get_obstruction_map = 3;
    GetDeviceInfoRequest get_device_info = 4;
    RebootRequest reboot = 5;
  }
}

message Response {
  oneof response {
    DishGetStatusResponse dish_get_status = 1;
    DishGetHistoryResponse dish_get_history = 2;
    DishGetObstructionMapResponse dish_get_obstruction_map = 3;
    DeviceInfo device_info = 4;
    RebootResponse reboot = 5;
  }
}

message GetStatusRequest {}
message GetHistoryRequest {}
message GetObstructionMapRequest {}
message GetDeviceInfoRequest {}
message RebootRequest {}
message RebootResponse {}

enum DishState {
  UNKNOWN = 0;
  CONNECTED = 1;
  BOOTING = 2;
  SEARCHING = 3;
  STOWED = 4;
  THERMAL_SHUTDOWN = 5;
  NO_SATS = 6;
  OBSTRUCTED = 7;
  NO_DOWNLINK = 8;
  NO_PINGS = 9;
}

message DeviceInfo {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  string country_code = 4;
  uint64 utc_offset_s = 5;
}

message DeviceState {
  uint64 uptime_s = 1;
}

message ObstructionStats {
  float fraction_obstructed = 1;
  bool currently_obstructed = 2;
  float avg_prolonged_obstruction_duration_s = 3;
  float avg_prolonged_obstruction_interval_s = 4;
}

// alerts is a bitfield on the real dish; we model it as decoded booleans.
message DishAlerts {
  bool motors_stuck = 1;
  bool thermal_throttle = 2;
  bool thermal_shutdown = 3;
  bool mast_not_near_vertical = 4;
  bool unexpected_location = 5;
  bool slow_ethernet_speeds = 6;
  bool roaming = 7;
  bool install_pending = 8;
  bool is_heating = 9;
  bool dish_water_detected = 10;
}

message GpsStats {
  bool gps_valid = 1;
  uint32 gps_sats = 2;
}

message DishGetStatusResponse {
  DeviceInfo device_info = 1;
  DeviceState device_state = 2;
  ObstructionStats obstruction_stats = 3;
  DishAlerts alerts = 4;
  float downlink_throughput_bps = 5;
  float uplink_throughput_bps = 6;
  float pop_ping_drop_rate = 7;
  float pop_ping_latency_ms = 8;
  float seconds_to_first_nonempty_slot = 9;
  bool is_snr_above_noise_floor = 10;
  GpsStats gps_stats = 11;
  float direction_azimuth = 12;
  float direction_elevation = 13;
  DishState state = 14;
}

// Ring buffer of 1 Hz samples. `current` increments forever; newest sample is at
// (current - 1) % len. Consumers de-dupe across polls using `current`.
message DishGetHistoryResponse {
  uint64 current = 1;
  repeated float pop_ping_drop_rate = 2;
  repeated float pop_ping_latency_ms = 3;
  repeated float downlink_throughput_bps = 4;
  repeated float uplink_throughput_bps = 5;
}

// Flat row-major grid. Value 0..1 = relative quality, -1 = no data.
message DishGetObstructionMapResponse {
  uint32 num_rows = 1;
  uint32 num_cols = 2;
  repeated float snr = 3;
}
